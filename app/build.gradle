plugins {
    id 'com.android.application'
}

android {
    namespace 'com.planetforge.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.planetforge.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug      // sideloadable straight away; swap in your own keystore to publish on Play
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
